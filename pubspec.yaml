name: finai
description: AI-powered financial coach application
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  flutter_localizations:
    sdk: flutter
  
  intl: ^0.20.2
  
  # State Management
  flutter_riverpod: ^2.6.1
  
  # Firebase
  firebase_core: ^3.8.1
  firebase_auth: ^5.3.4
  cloud_firestore: ^5.5.2
  
  # Authentication
  google_sign_in: ^6.2.2
  
  # Camera & Media
  image_picker: ^1.0.7
  
  # Speech Recognition
  speech_to_text: ^6.6.0
  
  # Permissions
  permission_handler: ^11.3.0
  
  # Local Database
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  
  # Network
  http: ^1.1.2
  
  # UI Components
  google_fonts: ^6.1.0
  
  # Charts
  fl_chart: ^0.65.0
  
  # Utils
  shared_preferences: ^2.2.2
  flutter_dotenv: ^5.1.0
  
  # Icons
  cupertino_icons: ^1.0.6
  quick_actions: ^1.1.0
  excel: ^4.0.6
  pdf: ^3.11.3
  path_provider: ^2.1.5
  share_plus: ^12.0.1
  google_generative_ai: ^0.4.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  
  build_runner: ^2.4.7
  hive_generator: ^2.0.1
  sign_in_with_apple: ^5.0.0

flutter:
  uses-material-design: true
  
  assets:
    - .env